bundle:
  name: contoso-freight-platform

variables:
  dev_workspace_host:
    description: Databricks dev workspace URL supplied by environment configuration.
  test_workspace_host:
    description: Databricks test workspace URL supplied by environment configuration.
  prod_workspace_host:
    description: Databricks prod workspace URL supplied by environment configuration.
  dev_catalog:
    default: contoso_freight_dev
  test_catalog:
    default: contoso_freight_test
  prod_catalog:
    default: contoso_freight_prod
  prod_service_principal_name:
    description: Production deployment service principal supplied by protected environment configuration.
  runtime_lts:
    default: "15.4.x-scala2.12"
  storage_account_name:
    description: Environment-specific ADLS Gen2 storage account name.
  dev_sql_warehouse_id:
    description: Development SQL warehouse id supplied by environment configuration.
  test_sql_warehouse_id:
    description: Test SQL warehouse id supplied by environment configuration.
  prod_sql_warehouse_id:
    description: Production SQL warehouse id supplied by protected environment configuration.

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    batch_feeds_workflow:
      name: contoso-freight-${bundle.target}-batch-feeds
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED
      tasks:
        - task_key: landing_readiness
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --source-system
              - batch_feeds
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --task
              - landing_readiness
          timeout_seconds: 1800
          max_retries: 3
          min_retry_interval_millis: 600000
        - task_key: bronze_ingestion
          depends_on:
            - task_key: landing_readiness
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --source-system
              - batch_feeds
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --checkpoint-path
              - ${var.checkpoint_root}/batch_feeds
              - --task
              - bronze_ingestion
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: bronze_quality_gate
          depends_on:
            - task_key: bronze_ingestion
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --task
              - bronze_quality_gate
          timeout_seconds: 1800
          max_retries: 0
        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_quality_gate
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --task
              - silver_transformation
          timeout_seconds: 3600
          max_retries: 1
        - task_key: silver_quality_gate
          depends_on:
            - task_key: silver_transformation
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --task
              - silver_quality_gate
          timeout_seconds: 1800
          max_retries: 0
      parameters:
        - name: processing_date
          default: "2026-01-01"
    relational_incremental_workflow:
      name: contoso-freight-${bundle.target}-relational-incremental
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/15 6-22 * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED
      tasks:
        - task_key: incremental_bronze_ingestion
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --source-system
              - legacy_tms
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - incremental
              - --checkpoint-path
              - ${var.checkpoint_root}/legacy_tms
              - --task
              - incremental_bronze_ingestion
          timeout_seconds: 3600
          max_retries: 3
          min_retry_interval_millis: 600000
        - task_key: incremental_quality_gate
          depends_on:
            - task_key: incremental_bronze_ingestion
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - incremental
              - --task
              - incremental_quality_gate
          timeout_seconds: 1800
          max_retries: 0
      parameters:
        - name: processing_date
          default: "2026-01-01"
    event_streaming_workflow:
      name: contoso-freight-${bundle.target}-event-streaming
      max_concurrent_runs: 1
      tasks:
        - task_key: streaming_ingestion
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --source-system
              - shipment_operational_events
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - streaming
              - --checkpoint-path
              - ${var.checkpoint_root}/streaming/shipment_operational_events
              - --task
              - streaming_ingestion
          max_retries: 5
          min_retry_interval_millis: 300000
        - task_key: streaming_quality_gate
          depends_on:
            - task_key: streaming_ingestion
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - streaming
              - --task
              - streaming_quality_gate
          timeout_seconds: 1800
          max_retries: 0
      parameters:
        - name: processing_date
          default: "2026-01-01"
    gold_publication_workflow:
      name: contoso-freight-${bundle.target}-gold-publication
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 15 * * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED
      tasks:
        - task_key: gold_transformation
          sql_task:
            file:
              path: src/databricks/models/gold_products.sql
            warehouse_id: ${var.sql_warehouse_id}
          timeout_seconds: 1800
          max_retries: 1
        - task_key: gold_quality_gate
          depends_on:
            - task_key: gold_transformation
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --task
              - gold_quality_gate
          timeout_seconds: 1800
          max_retries: 0
        - task_key: publish_readiness
          depends_on:
            - task_key: gold_quality_gate
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - batch
              - --task
              - publish_readiness
          timeout_seconds: 900
          max_retries: 0
      parameters:
        - name: processing_date
          default: "2026-01-01"
    controlled_backfill_replay_workflow:
      name: contoso-freight-${bundle.target}-controlled-backfill-replay
      max_concurrent_runs: 1
      tasks:
        - task_key: backfill_plan_validation
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --source-system
              - "{{job.parameters.source_system}}"
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - backfill
              - --replay-mode
              - range
              - --task
              - backfill_plan_validation
          timeout_seconds: 1800
          max_retries: 0
        - task_key: backfill_execute
          depends_on:
            - task_key: backfill_plan_validation
          spark_python_task:
            python_file: src/databricks/orchestration/job_entrypoints.py
            parameters:
              - --environment
              - ${bundle.target}
              - --catalog
              - ${var.catalog}
              - --source-system
              - "{{job.parameters.source_system}}"
              - --processing-date
              - "{{job.parameters.processing_date}}"
              - --load-type
              - backfill
              - --replay-mode
              - range
              - --task
              - backfill_execute
          timeout_seconds: 7200
          max_retries: 0
      parameters:
        - name: source_system
          default: legacy_tms
        - name: processing_date
          default: "2026-01-01"
permissions:
  - level: CAN_MANAGE
    group_name: grp-platform-admins
  - level: CAN_MANAGE_RUN
    group_name: grp-platform-operators
  - level: CAN_VIEW
    group_name: grp-data-governance

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.dev_workspace_host}
    variables:
      catalog: ${var.dev_catalog}
      checkpoint_root: abfss://checkpoints@${var.storage_account_name}.dfs.core.windows.net/dev
      sql_warehouse_id: ${var.dev_sql_warehouse_id}
  test:
    mode: production
    workspace:
      host: ${var.test_workspace_host}
    variables:
      catalog: ${var.test_catalog}
      checkpoint_root: abfss://checkpoints@${var.storage_account_name}.dfs.core.windows.net/test
      sql_warehouse_id: ${var.test_sql_warehouse_id}
  prod:
    mode: production
    workspace:
      host: ${var.prod_workspace_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_service_principal_name}
    variables:
      catalog: ${var.prod_catalog}
      checkpoint_root: abfss://checkpoints@${var.storage_account_name}.dfs.core.windows.net/prod
      sql_warehouse_id: ${var.prod_sql_warehouse_id}
