bundle:
  name: contoso-freight-platform

variables:
  dev_workspace_host:
    description: Databricks dev workspace URL supplied by environment configuration.
  test_workspace_host:
    description: Databricks test workspace URL supplied by environment configuration.
  prod_workspace_host:
    description: Databricks prod workspace URL supplied by environment configuration.
  dev_catalog:
    default: contoso_freight_dev
  test_catalog:
    default: contoso_freight_test
  prod_catalog:
    default: contoso_freight_prod
  prod_service_principal_name:
    description: Production deployment service principal supplied by protected environment configuration.
  runtime_lts:
    default: "15.4.x-scala2.12"
  storage_account_name:
    description: Environment-specific ADLS Gen2 storage account name.

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.dev_workspace_host}
    variables:
      catalog: ${var.dev_catalog}
    resources:
      jobs:
        medallion_validation:
          name: contoso-freight-medallion-validation-dev
          tasks:
            - task_key: validate_pipeline_modules
              spark_python_task:
                python_file: ../src/databricks/notebooks/ingestion_entrypoint.py
                parameters:
                  - --catalog
                  - ${var.dev_catalog}
                  - --environment
                  - dev
  test:
    mode: production
    workspace:
      host: ${var.test_workspace_host}
    variables:
      catalog: ${var.test_catalog}
    resources:
      jobs:
        medallion_validation:
          name: contoso-freight-medallion-validation-test
          tasks:
            - task_key: validate_pipeline_modules
              spark_python_task:
                python_file: ../src/databricks/notebooks/ingestion_entrypoint.py
                parameters:
                  - --catalog
                  - ${var.test_catalog}
                  - --environment
                  - test
  prod:
    mode: production
    workspace:
      host: ${var.prod_workspace_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_service_principal_name}
    variables:
      catalog: ${var.prod_catalog}
    resources:
      jobs:
        medallion_validation:
          name: contoso-freight-medallion-validation-prod
          tasks:
            - task_key: validate_pipeline_modules
              spark_python_task:
                python_file: ../src/databricks/notebooks/ingestion_entrypoint.py
                parameters:
                  - --catalog
                  - ${var.prod_catalog}
                  - --environment
                  - prod
