name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Run final assurance
        run: make release-assurance

  sql-project:
    name: SQL project build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Generate SQL release evidence
        run: make validate-sql-cicd

      - name: Build SQL project dacpac
        run: make build-sql-project

      - name: Upload dacpac artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy_tms-dacpac
          path: src/azure_sql/database_project/legacy_tms/bin/**/*.dacpac
